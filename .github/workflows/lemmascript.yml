name: LemmaScript

on:
  push:
    branches: [main, lemmascript]
  pull_request:
    branches: [main, lemmascript]

jobs:
  dafny:
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@main
    with:
      backend: dafny
      typecheck: false

  lean:
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@main
    with:
      backend: lean
      typecheck: false
